name: Songs trial
on:
  push:
    branches: [main, 'cms/**', 'trial/**']
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: songs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate Songs page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
      - name: Limit CMS drafts to page, collection and shared fact content
        if: startsWith(github.ref_name, 'cms/')
        run: node scripts/check-editorial-diff.mjs
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: npm run build
      - name: Publish an exact draft preview or production revision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs
